<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe Bolt</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body, html { 
            background: #000; 
            color: #fff; 
            font-family: 'Varela Round', sans-serif; 
            margin: 0; padding: 0; 
            height: 100%; 
            overflow: hidden; 
            position: fixed; 
            width: 100%; 
        }
        
        .modal { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.98); 
            z-index: 2000; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }

        /* לוגו מרכזי - תיקון רווחים */
        .logo-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 90%;
            max-width: 420px;
        }

        .tic-tac-toe-text {
            color: #00f2ff;
            font-weight: 900;
            font-style: italic;
            font-size: 2rem;
            line-height: 1;
            text-transform: uppercase;
            text-shadow: 0 0 15px #00f2ff;
            display: flex;
            justify-content: center;
            gap: 8px; /* צמצום משמעותי בין המילים */
            margin-bottom: 25px; /* הגדלת הרווח למטה לכיוון BOLT לקריאות */
            letter-spacing: -0.02em;
        }

        .bolt-text { 
            font-size: 25vw; 
            max-font-size: 145px;
            font-weight: 950;
            font-style: italic;
            color: #facc15;
            line-height: 0.8;
            text-shadow: 0 0 30px #facc15;
            display: flex;
            align-items: center;
            direction: ltr !important; /* הבטחת סדר אותיות BOLT משמאל לימין */
            letter-spacing: -0.03em;
        }

        .o-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .bolt-icon {
            position: absolute;
            font-size: 0.55em;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        @media (min-width: 500px) {
            .bolt-text { font-size: 135px; }
            .tic-tac-toe-text { font-size: 2.5rem; gap: 12px; }
        }

        /* כפתורים ועיצוב כללי */
        .btn-main { 
            width: 300px; 
            height: 60px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 20px; 
            font-weight: 900; 
            margin-bottom: 15px; 
            border: 2px solid; 
            cursor: pointer; 
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
        .btn-main:active { transform: scale(0.95); }

        .board { 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            width: 340px; height: 340px; position: relative; margin-bottom: 30px;
        }
        .board::before, .board::after { content: ''; position: absolute; background: #fff; border-radius: 10px; }
        .board::before { width: 6px; height: 100%; left: 33.33%; box-shadow: 113px 0 0 #fff, 0 0 10px #fff; }
        .board::after { height: 6px; width: 100%; top: 33.33%; box-shadow: 0 113px 0 #fff, 0 0 10px #fff; }
        
        .cell { display: flex; align-items: center; justify-content: center; font-size: 6.5rem; font-weight: 900; width: 113px; height: 113px; cursor: pointer; z-index: 10; }
        .x-style { color: #fff; text-shadow: 0 0 25px #00f2ff; }
        .o-style { color: #fff; text-shadow: 0 0 25px #bc13fe; }
        
        .back-btn { position: absolute; top: 20px; right: 20px; font-size: 2.5rem; cursor: pointer; transform: scaleX(-1); color: #666; }
        
        #speedTimer { position: fixed; top: 0; left: 0; height: 8px; background: #facc15; width: 0%; z-index: 3000; transition: width 0.1s linear; }
    </style>
</head>
<body>

    <div id="speedTimer"></div>

    <div id="lobby" class="modal" style="display: flex;">
        <div class="logo-container">
            <div class="tic-tac-toe-text">
                <span>TIC</span><span>TAC</span><span>TOE</span>
            </div>
            <div class="bolt-text">
                B<span class="o-wrap">O<span class="bolt-icon">⚡</span></span>LT
            </div>
        </div>

        <button onclick="showModal('vocabModal')" class="btn-main border-[#facc15] text-[#facc15]">הכנסת מילים / ייבוא</button>
        <button onclick="startGame('pvp')" class="btn-main border-white text-white">2 שחקנים</button>
        <button onclick="startGame('speed')" class="btn-main border-orange-500 text-orange-500">Speed Run ⚡</button>
        <button onclick="showModal('aiDifficultyModal')" class="btn-main border-[#bc13fe] text-[#bc13fe]">נגד המחשב</button>
        
        <div class="mt-8 text-zinc-600 text-sm">© פיתוח חזי כהן גלמן 2026</div>
    </div>

    <div id="gameUI" class="hidden flex-col items-center justify-center h-full">
        <div onclick="location.reload()" class="back-btn">➔</div>
        <div id="statusHeader" class="text-4xl font-black italic mb-10"></div>
        <div id="mainBoard" class="board"></div>
        <button id="nextQuestionBtn" onclick="showQuiz()" class="btn-main border-[#facc15] text-[#facc15] hidden">לחץ לשאלה ?</button>
    </div>

    <div id="quizModal" class="modal">
        <div id="qText" class="text-6xl font-black mb-12 italic text-center" style="direction: ltr;"></div>
        <div id="qOptions" class="flex flex-col gap-4 w-full max-w-xs"></div>
    </div>

    <div id="aiDifficultyModal" class="modal">
        <h2 class="text-white text-3xl font-black mb-8 italic">בחר רמת קושי</h2>
        <button onclick="hideModal('aiDifficultyModal'); startGame('pvc', 'easy')" class="btn-main border-[#00f2ff] text-[#00f2ff]">קל</button>
        <button onclick="hideModal('aiDifficultyModal'); startGame('pvc', 'hard')" class="btn-main border-[#bc13fe] text-[#bc13fe]">מאתגר</button>
    </div>

    <div id="vocabModal" class="modal">
        <h2 class="text-[#facc15] text-3xl font-black mb-4 italic">רשימת מילים</h2>
        <textarea id="vIn" placeholder="apple - תפוח" class="w-80 h-64 bg-zinc-900 border-2 border-zinc-700 text-white p-4 rounded-2xl mb-4 text-right outline-none"></textarea>
        <button onclick="hideModal('vocabModal')" class="btn-main bg-[#facc15] text-black border-none">שמור</button>
    </div>

    <div id="winModal" class="modal text-center">
        <h2 id="winTitle" class="text-6xl font-black mb-10"></h2>
        <button onclick="location.reload()" class="btn-main border-[#facc15] text-[#facc15]">משחק חדש</button>
    </div>

    <script>
        let vocab = [], gameMode = 'pvp', difficulty = 'hard', board = Array(9).fill(""), history = {X:[], O:[]}, turn = "X", canMove = false, isGameOver = false;
        let speedInterval, timeLeft = 100;

        window.onload = () => {
            const saved = localStorage.getItem('ttt_vocab');
            if(saved) document.getElementById('vIn').value = saved;
        };

        const showModal = id => document.getElementById(id).style.display = 'flex';
        const hideModal = id => document.getElementById(id).style.display = 'none';

        function startGame(mode, diff = 'hard') {
            const raw = document.getElementById('vIn').value;
            vocab = raw.split('\n').map(l => {
                const p = l.split(/[-:]/);
                return p.length >= 2 ? { en: p[0].trim(), he: p[1].trim() } : null;
            }).filter(x => x);

            if(vocab.length < 2) { alert("נא להכניס לפחות 2 מילים בפורמט: מילה - תרגום"); return; }
            localStorage.setItem('ttt_vocab', raw);
            
            gameMode = mode; difficulty = diff;
            hideModal('lobby');
            document.getElementById('gameUI').classList.replace('hidden', 'flex');
            initBoard();
            startTurn();
        }

        function initBoard() {
            const b = document.getElementById('mainBoard'); b.innerHTML = '';
            for(let i=0; i<9; i++) {
                const c = document.createElement('div'); c.className = 'cell';
                c.onclick = () => { if(canMove && !isGameOver) makeMove(i); };
                b.appendChild(c);
            }
        }

        function startTurn() {
            if(isGameOver) return;
            document.getElementById('statusHeader').innerHTML = `תור <span class="${turn==='X'?'text-[#00f2ff]':'text-[#bc13fe]'}">${turn}</span>`;
            document.getElementById('nextQuestionBtn').classList.remove('hidden');
            if(gameMode === 'pvc' && turn === 'O') setTimeout(aiAction, 800);
        }

        function showQuiz() {
            const item = vocab[Math.floor(Math.random() * vocab.length)];
            const opts = [item.he];
            while(opts.length < Math.min(4, vocab.length)) {
                const r = vocab[Math.floor(Math.random()*vocab.length)].he;
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => Math.random() - 0.5);

            document.getElementById('qText').textContent = item.en;
            document.getElementById('qText').style.color = turn === 'X' ? '#00f2ff' : '#bc13fe';
            
            const container = document.getElementById('qOptions'); container.innerHTML = '';
            opts.forEach(o => {
                const btn = document.createElement('button');
                btn.className = 'w-full p-4 rounded-xl border-2 border-zinc-700 text-xl font-bold hover:bg-zinc-800';
                btn.textContent = o;
                btn.onclick = () => {
                    if(o === item.he) {
                        clearInterval(speedInterval);
                        hideModal('quizModal');
                        canMove = true;
                        document.getElementById('nextQuestionBtn').classList.add('hidden');
                    } else {
                        clearInterval(speedInterval);
                        hideModal('quizModal');
                        switchTurn();
                    }
                };
                container.appendChild(btn);
            });
            showModal('quizModal');
            if(gameMode === 'speed') {
                timeLeft = 100;
                speedInterval = setInterval(() => {
                    timeLeft -= 2.5;
                    document.getElementById('speedTimer').style.width = timeLeft + "%";
                    if(timeLeft <= 0) { clearInterval(speedInterval); hideModal('quizModal'); switchTurn(); }
                }, 100);
            }
        }

        function makeMove(i) {
            if(board[i] !== "") return;
            board[i] = turn; history[turn].push(i);
            if(checkWin(board, turn)) { isGameOver = true; render(); triggerWin(); return; }
            if(history[turn].length > 3) board[history[turn].shift()] = "";
            render(); canMove = false; switchTurn();
        }

        function switchTurn() { turn = turn === "X" ? "O" : "X"; render(); startTurn(); }

        function render() {
            document.querySelectorAll('.cell').forEach((c, i) => {
                c.textContent = board[i] === "X" ? "✕" : (board[i] === "O" ? "◯" : "");
                c.className = "cell " + (board[i] === "X" ? "x-style" : (board[i] === "O" ? "o-style" : ""));
                if(board[i] && history[board[i]][0] === i && history[board[i]].length === 3) c.style.opacity = "0.3";
                else c.style.opacity = "1";
            });
        }

        function checkWin(b, p) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(pats => pats.every(idx => b[idx] === p));
        }

        function triggerWin() {
            confetti({ particleCount: 150, spread: 70 });
            document.getElementById('winTitle').textContent = `ניצחון ל-${turn}!`;
            showModal('winModal');
        }

        function aiAction() {
            const av = board.map((v,i)=>v===""?i:null).filter(v=>v!==null);
            if(av.length > 0) makeMove(av[Math.floor(Math.random()*av.length)]);
        }
    </script>
</body>
</html>
