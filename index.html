<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe Bolt v. 3.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body, html { 
            background: #050505; color: #fff; font-family: 'Varela Round', sans-serif; 
            margin: 0; padding: 0; height: 100%; overflow: hidden; position: fixed; width: 100%; 
        }
        .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,0.98); z-index: 100; }
        .active-screen { display: flex; }
        
        .btn-ui { 
            width: 280px; padding: 16px; border-radius: 20px; font-weight: 900; 
            border: 2px solid; margin-bottom: 12px; cursor: pointer; text-align: center; 
            transition: transform 0.1s; 
        }
        .btn-ui:active { transform: scale(0.95); }

        /* לוח משחק */
        .grid-bolt {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 12px; width: 90vw; max-width: 380px; aspect-ratio: 1/1;
            background: #111; padding: 12px; border-radius: 20px; border: 2px solid #333;
        }
        .cell {
            background: #000; border-radius: 12px; display: flex; align-items: center; 
            justify-content: center; font-size: 4rem; font-weight: 900; cursor: pointer;
        }
        .x-sign { color: #00f2ff; text-shadow: 0 0 15px #00f2ff; }
        .o-sign { color: #bc13fe; text-shadow: 0 0 15px #bc13fe; }
        .ghost { opacity: 0.25; filter: blur(2px); }

        /* כפתור חזרה גלובלי */
        .back-nav {
            position: absolute; top: 25px; right: 25px; font-size: 2rem; 
            color: #555; cursor: pointer; z-index: 1000;
        }

        .q-btn {
            width: 90px; height: 90px; border-radius: 50%; border: 4px solid #facc15;
            color: #facc15; font-size: 4rem; font-weight: 900; display: flex; 
            align-items: center; justify-content: center; margin-top: 30px; 
            animation: pulse 2s infinite; cursor: pointer;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
</head>
<body>

    <div id="lobby" class="screen active-screen">
        <div class="text-center mb-12">
            <h1 class="text-[#facc15] text-8xl font-black italic">BOLT</h1>
            <p class="text-white opacity-50 tracking-widest text-xl">TIC TAC TOE</p>
        </div>
        <textarea id="vIn" class="w-72 h-32 bg-zinc-900 border-2 border-zinc-700 text-white p-3 rounded-xl mb-6 text-right outline-none focus:border-[#facc15]" placeholder="dog - כלב"></textarea>
        <button onclick="navTo('game-type')" class="btn-ui border-[#facc15] text-[#facc15]">שחק עכשיו</button>
    </div>

    <div id="game-type" class="screen">
        <div class="back-nav" onclick="navTo('lobby')">➔</div>
        <h2 class="text-3xl font-black mb-10 italic">בחר מצב משחק</h2>
        <button onclick="startGame('pvp')" class="btn-ui border-white text-white">2 שחקנים (אותו מכשיר)</button>
        <button onclick="navTo('ai-difficulty')" class="btn-ui border-[#bc13fe] text-[#bc13fe]">נגד המחשב</button>
    </div>

    <div id="ai-difficulty" class="screen">
        <div class="back-nav" onclick="navTo('game-type')">➔</div>
        <h2 class="text-3xl font-black mb-10 italic">רמת קושי</h2>
        <button onclick="startGame('pvc', 'easy')" class="btn-ui border-[#00f2ff] text-[#00f2ff]">קל</button>
        <button onclick="startGame('pvc', 'hard')" class="btn-ui border-[#bc13fe] text-[#bc13fe]">מאתגר</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="back-nav" onclick="location.reload()">➔</div>
        <div id="status" class="text-4xl font-black italic mb-8"></div>
        <div id="board" class="grid-bolt"></div>
        <div id="qBtn" onclick="showQuiz()" class="q-btn">?</div>
    </div>

    <div id="quiz-modal" class="screen" style="background: rgba(0,0,0,0.99);">
        <div id="qWord" class="text-6xl font-black mb-12 italic" dir="ltr"></div>
        <div id="qOptions" class="flex flex-col gap-4 w-80"></div>
    </div>

    <div id="win-modal" class="screen">
        <h2 id="winMsg" class="text-7xl font-black mb-10"></h2>
        <button onclick="location.reload()" class="btn-ui border-[#facc15] text-[#facc15]">חזרה לתפריט</button>
    </div>

    <script>
        let vocab = [], turn = "X", canMove = false, isGameOver = false;
        let mode = 'pvp', diff = 'hard';
        let board = Array(9).fill("");
        let history = { X: [], O: [] };

        window.onload = () => {
            const saved = localStorage.getItem('ttt_bolt_v3');
            document.getElementById('vIn').value = saved || "Apple - תפוח\nDog - כלב\nSun - שמש\nBook - ספר\nWater - מים";
        };

        function navTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(screenId).classList.add('active-screen');
        }

        function startGame(gMode, gDiff = 'hard') {
            const raw = document.getElementById('vIn').value;
            localStorage.setItem('ttt_bolt_v3', raw);
            vocab = raw.split('\n').map(l => {
                const p = l.split(/[-:]/);
                return p.length >= 2 ? { en: p[0].trim(), he: p[1].trim() } : null;
            }).filter(x => x);

            if(vocab.length < 2) return alert("הזן לפחות 2 מילים");

            mode = gMode; diff = gDiff;
            navTo('game-screen');
            initBoard();
            nextTurn();
        }

        function initBoard() {
            const b = document.getElementById('board');
            b.innerHTML = '';
            for(let i=0; i<9; i++) {
                const c = document.createElement('div');
                c.className = 'cell';
                c.onclick = () => makeMove(i);
                b.appendChild(c);
            }
        }

        function nextTurn() {
            canMove = false;
            const color = turn === "X" ? "#00f2ff" : "#bc13fe";
            document.getElementById('status').innerHTML = `<span style="color:${color}">תור ${turn}</span>`;
            document.getElementById('qBtn').style.borderColor = color;
            document.getElementById('qBtn').style.color = color;
            document.getElementById('qBtn').style.display = 'flex';
            render();
            if(mode === 'pvc' && turn === 'O') setTimeout(aiMove, 800);
        }

        function showQuiz() {
            const item = vocab[Math.floor(Math.random() * vocab.length)];
            const opts = [item.he];
            while(opts.length < Math.min(4, vocab.length)) {
                const r = vocab[Math.floor(Math.random()*vocab.length)].he;
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => Math.random() - 0.5);

            document.getElementById('qWord').textContent = item.en;
            document.getElementById('qWord').style.color = turn === 'X' ? '#00f2ff' : '#bc13fe';
            
            const container = document.getElementById('qOptions');
            container.innerHTML = '';
            opts.forEach(o => {
                const b = document.createElement('div');
                b.className = 'btn-ui border-zinc-700 text-white';
                b.textContent = o;
                b.onclick = () => {
                    if(o === item.he) {
                        b.style.borderColor = '#22c55e';
                        setTimeout(() => { navTo('game-screen'); canMove = true; document.getElementById('qBtn').style.display = 'none'; }, 600);
                    } else {
                        b.style.borderColor = '#ef4444';
                        Array.from(container.children).forEach(c => { if(c.textContent === item.he) c.style.borderColor = '#22c55e'; });
                        setTimeout(() => { navTo('game-screen'); switchTurn(); }, 1400);
                    }
                };
                container.appendChild(b);
            });
            navTo('quiz-modal');
        }

        function makeMove(i) {
            if(!canMove || isGameOver || board[i] !== "") return;
            
            board[i] = turn;
            history[turn].push(i);
            
            if(history[turn].length > 3) {
                const first = history[turn].shift();
                board[first] = "";
            }

            if(checkWin(turn)) {
                render();
                isGameOver = true;
                confetti({ particleCount: 150, spread: 70 });
                document.getElementById('winMsg').textContent = `ניצחון ל-${turn}!`;
                document.getElementById('winMsg').style.color = turn === 'X' ? '#00f2ff' : '#bc13fe';
                setTimeout(() => navTo('win-modal'), 800);
                return;
            }

            switchTurn();
        }

        function switchTurn() { turn = turn === "X" ? "O" : "X"; nextTurn(); }

        function render() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((c, i) => {
                const val = board[i];
                c.textContent = val === "X" ? "✕" : (val === "O" ? "◯" : "");
                c.className = `cell ${val === "X" ? "x-sign" : "o-sign"}`;
                if(val && history[val].length === 3 && history[val][0] === i) c.classList.add('ghost');
            });
        }

        function checkWin(p) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(pattern => pattern.every(idx => board[idx] === p));
        }

        function aiMove() {
            const empty = board.map((v,i) => v===""?i:null).filter(v=>v!==null);
            if(empty.length === 0) return;
            const move = empty[Math.floor(Math.random()*empty.length)];
            canMove = true; makeMove(move);
        }
    </script>
</body>
</html>
