<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe Bolt v. 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body, html { background: #000; color: #fff; font-family: 'Varela Round', sans-serif; margin: 0; padding: 0; height: 100%; overflow: hidden; position: fixed; width: 100%; }
        .grid-container { display: grid; grid-template-columns: 20px 320px; grid-template-rows: 20px 320px; gap: 10px; margin: 0 auto; justify-content: center; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); width: 320px; height: 320px; position: relative; }
        .board::before, .board::after { content: ''; position: absolute; background: #fff; border-radius: 10px; box-shadow: 0 0 10px #fff; }
        .board::before { width: 5px; height: 100%; left: 33%; box-shadow: 106px 0 0 #fff, 0 0 10px #fff, 106px 0 10px #fff; }
        .board::after { height: 5px; width: 100%; top: 33%; box-shadow: 0 106px 0 #fff, 0 0 10px #fff, 0 106px 10px #fff; }
        .cell { display: flex; align-items: center; justify-content: center; font-size: 6rem; font-weight: 900; width: 106px; height: 106px; cursor: pointer; z-index: 10; }
        .x-lightsaber { color: #fff; text-shadow: 0 0 7px #fff, 0 0 15px #fff, 0 0 25px #00f2ff, 0 0 45px #00f2ff; -webkit-text-stroke: 1px rgba(255,255,255,0.5); }
        .o-lightsaber { color: #fff; text-shadow: 0 0 7px #fff, 0 0 15px #fff, 0 0 25px #bc13fe, 0 0 45px #bc13fe; -webkit-text-stroke: 1px rgba(255,255,255,0.5); }
        .ghost { opacity: 0.15; filter: blur(2px); }
        .btn-main { width: 300px; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 20px; font-weight: 900; margin-bottom: 15px; border: 2px solid; cursor: pointer; transition: 0.2s; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .correct-pulse { animation: pulse-green 0.6s infinite; border-color: #22c55e !important; }
        @keyframes pulse-green { 0%, 100% { box-shadow: 0 0 0px #22c55e; } 50% { box-shadow: 0 0 20px #22c55e; } }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        .timer-bar { position: fixed; top: 0; left: 0; height: 8px; background: #facc15; width: 0%; z-index: 3000; }
        .ltr-text { direction: ltr; }
        .btn-speed { direction: ltr; display: flex; flex-direction: row-reverse; gap: 10px; }
    </style>
</head>
<body>

    <div id="speedTimer" class="timer-bar"></div>

    <div id="lobby" class="modal" style="display: flex;">
        <div class="absolute top-5 text-zinc-600 font-mono">v. 2.0</div>
        <div class="flex flex-col items-center mb-10">
            <h1 class="text-[#00f2ff] text-5xl font-black italic mb-0 leading-none">TIC TAC TOE</h1>
            <h1 class="text-[#facc15] text-8xl font-black italic mt-0" style="text-shadow: 0 0 30px #facc15;">BOLT ⚡</h1>
        </div>
        <button onclick="showModal('vocabModal')" class="btn-main border-[#facc15] text-[#facc15]">הכנסת מילים / ייבוא</button>
        <button onclick="startGame('pvp')" class="btn-main border-white text-white">2 שחקנים</button>
        <button onclick="startGame('speed')" class="btn-main border-orange-500 text-orange-500 btn-speed"><span>Speed Run</span><span>⚡</span></button>
        <button onclick="showModal('aiDifficultyModal')" class="btn-main border-[#bc13fe] text-[#bc13fe]">נגד המחשב</button>
    </div>

    <div id="aiDifficultyModal" class="modal">
        <h2 class="text-white text-3xl font-black mb-8 italic text-center">בחר רמת קושי למחשב</h2>
        <button onclick="hideModal('aiDifficultyModal'); startGame('pvc', 'easy')" class="btn-main border-[#00f2ff] text-[#00f2ff]">קל</button>
        <button onclick="hideModal('aiDifficultyModal'); startGame('pvc', 'hard')" class="btn-main border-[#bc13fe] text-[#bc13fe]">מאתגר</button>
        <button onclick="hideModal('aiDifficultyModal')" class="text-zinc-500 mt-4 underline">ביטול</button>
    </div>

    <div id="vocabModal" class="modal">
        <h2 class="text-[#facc15] text-3xl font-black mb-4 italic text-center">רשימת מילים</h2>
        <textarea id="vIn" oninput="localStorage.setItem('ttt_vocab', this.value)" placeholder="apple - תפוח" class="w-80 h-64 bg-black border-2 border-zinc-800 text-white p-4 rounded-2xl mb-4 text-right outline-none focus:border-[#facc15]"></textarea>
        <div class="flex gap-2 mb-4">
            <button onclick="exportWords()" class="bg-zinc-800 px-4 py-2 rounded-lg text-sm">ייצוא קובץ</button>
            <button onclick="document.getElementById('fileIn').click()" class="bg-zinc-800 px-4 py-2 rounded-lg text-sm">ייבוא קובץ</button>
            <input type="file" id="fileIn" class="hidden" onchange="importWords(this)">
        </div>
        <button onclick="hideModal('vocabModal')" class="btn-main bg-[#facc15] text-black border-none h-14">שמור וסגור</button>
    </div>

    <div id="gameUI" class="hidden flex-col items-center justify-center h-full">
        <button onclick="location.reload()" class="absolute top-5 right-5 text-4xl">➔</button>
        <div id="statusHeader" class="mb-6 text-3xl font-black italic"></div>
        <div class="grid-container">
            <div></div><div class="grid grid-cols-3 w-full"><div class="text-zinc-800 text-center">1</div><div class="text-zinc-800 text-center">2</div><div class="text-zinc-800 text-center">3</div></div>
            <div class="flex flex-col justify-around text-zinc-800 pr-2"><div>A</div><div>B</div><div>C</div></div>
            <div id="mainBoard" class="board"></div>
        </div>
        <button id="nextQuestionBtn" onclick="showQuiz()" class="btn-main mt-10 border-[#facc15] text-[#facc15] bg-[#facc15]/10">שאלה הבאה</button>
    </div>

    <div id="quizModal" class="modal">
        <div id="qText" class="text-6xl font-black mb-12 italic text-center ltr-text"></div>
        <div id="qOptions" class="flex flex-col gap-4 w-72"></div>
    </div>

    <div id="winModal" class="modal text-center">
        <h2 id="winTitle" class="text-6xl font-black mb-4"></h2>
        <div id="winnerIcon" class="text-9xl mb-8"></div>
        <div id="statsBox" class="bg-zinc-900 p-4 rounded-2xl w-80 mb-8 border border-zinc-700">
            <h3 class="text-zinc-400 text-sm mb-2">מילים שדורשות תרגול:</h3>
            <div id="hardWords" class="text-red-400 font-bold italic"></div>
        </div>
        <button onclick="location.reload()" class="btn-main border-[#facc15] text-[#facc15]">משחק חדש</button>
    </div>

    <script>
        let vocab = [], gameMode = 'pvp', difficulty = 'hard', board = Array(9).fill(""), history = {X:[], O:[]}, turn = "X", canMove = false, isGameOver = false;
        let stats = {}, speedInterval;

        window.onload = () => {
            const saved = localStorage.getItem('ttt_vocab');
            if(saved) document.getElementById('vIn').value = saved;
        };

        const showModal = id => document.getElementById(id).style.display = 'flex';
        const hideModal = id => document.getElementById(id).style.display = 'none';

        function parseVocab() {
            const raw = document.getElementById('vIn').value;
            vocab = raw.split('\n').map(l => {
                const p = l.split(/[–\-\—:]/);
                return p.length >= 2 ? { en: p[0].trim(), he: p[1].trim() } : null;
            }).filter(x => x);
            return vocab.length >= 2;
        }

        function startGame(mode, diff = 'hard') {
            if(!parseVocab()) { alert("נא להכניס מילים."); return; }
            gameMode = mode; difficulty = diff;
            hideModal('lobby'); 
            document.getElementById('gameUI').classList.replace('hidden', 'flex');
            initBoard(); startTurn();
        }

        function initBoard() {
            const b = document.getElementById('mainBoard'); b.innerHTML = '';
            for(let i=0; i<9; i++) {
                const c = document.createElement('div'); c.className = 'cell';
                c.onclick = () => { if(canMove && !isGameOver) makeMove(i); };
                b.appendChild(c);
            }
        }

        function startTurn() {
            if(isGameOver) return;
            const cls = turn === 'X' ? 'x-lightsaber' : 'o-lightsaber';
            document.getElementById('statusHeader').innerHTML = `<span class="${cls}">תור ${turn}</span>`;
            document.getElementById('nextQuestionBtn').classList.remove('hidden');
            if(gameMode === 'pvc' && turn === 'O') setTimeout(aiAction, 800);
        }

        function showQuiz() {
            const item = vocab[Math.floor(Math.random() * vocab.length)];
            const opts = [item.he];
            while(opts.length < Math.min(4, vocab.length)) {
                const r = vocab[Math.floor(Math.random()*vocab.length)].he;
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => Math.random() - 0.5);
            
            const qT = document.getElementById('qText');
            qT.textContent = item.en;
            qT.className = `text-6xl font-black mb-12 italic text-center ltr-text ${turn==='X'?'text-[#00f2ff]':'text-[#bc13fe]'}`;
            
            const container = document.getElementById('qOptions'); container.innerHTML = '';
            opts.forEach(o => {
                const btn = document.createElement('button');
                btn.className = 'w-full py-4 rounded-xl border-2 border-zinc-800 text-xl font-bold';
                btn.textContent = o;
                btn.onclick = () => handleAnswer(o === item.he, btn, item);
                container.appendChild(btn);
            });
            showModal('quizModal');
            if(gameMode === 'speed') startTimer();
        }

        function startTimer() {
            let time = 100;
            const bar = document.getElementById('speedTimer');
            clearInterval(speedInterval);
            speedInterval = setInterval(() => {
                time -= 2; bar.style.width = time + "%";
                if(time <= 0) { clearInterval(speedInterval); handleAnswer(false, null, {he:'', en: 'זמן עבר'}); }
            }, 100);
        }

        function handleAnswer(isCorrect, btn, item) {
            clearInterval(speedInterval);
            document.getElementById('speedTimer').style.width = "0%";
            if(isCorrect) {
                if(btn) btn.style.borderColor = '#22c55e';
                setTimeout(() => { hideModal('quizModal'); canMove = true; }, 600);
            } else {
                if(btn) btn.style.borderColor = '#ef4444';
                if(item.en !== 'זמן עבר') stats[item.en] = (stats[item.en] || 0) + 1;
                document.getElementById('quizModal').classList.add('shake');
                Array.from(document.getElementById('qOptions').children).forEach(b => {
                    if(b.textContent === item.he) b.classList.add('correct-pulse');
                });
                setTimeout(() => { 
                    hideModal('quizModal'); document.getElementById('quizModal').classList.remove('shake');
                    switchTurn(); 
                }, 1500);
            }
        }

        function makeMove(i) {
            if(board[i] !== "") return;
            board[i] = turn; history[turn].push(i);
            if(checkWin(board, turn)) { isGameOver = true; render(); triggerWin(); return; }
            if(history[turn].length > 3) board[history[turn].shift()] = "";
            render(); canMove = false; switchTurn();
        }

        function triggerWin() {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            const title = document.getElementById('winTitle');
            title.textContent = `${turn} - ניצחון!`;
            title.className = `text-6xl font-black mb-4 ${turn==='X'?'x-lightsaber':'o-lightsaber'}`;
            document.getElementById('winnerIcon').textContent = turn === 'X' ? '✕' : '◯';
            document.getElementById('winnerIcon').className = `text-9xl mb-8 ${turn==='X'?'x-lightsaber':'o-lightsaber'}`;
            
            const hard = Object.entries(stats).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
            document.getElementById('hardWords').textContent = hard.length ? hard.join(', ') : 'אין טעויות! כל הכבוד!';
            setTimeout(() => showModal('winModal'), 600);
        }

        function switchTurn() { turn = turn === "X" ? "O" : "X"; render(); startTurn(); }

        function render() {
            document.querySelectorAll('.cell').forEach((c, i) => {
                const v = board[i]; c.textContent = v === "X" ? "✕" : (v === "O" ? "◯" : "");
                c.className = "cell " + (v === "X" ? "x-lightsaber" : (v === "O" ? "o-lightsaber" : ""));
                if(v && !isGameOver && history[v].length === 3 && history[v][0] === i) c.classList.add('ghost');
            });
        }

        function checkWin(b, p) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(pats => pats.every(idx => b[idx] === p));
        }

        function aiAction() {
            let m;
            if(difficulty === 'easy') {
                const av = board.map((v,i)=>v===""?i:null).filter(v=>v!==null);
                m = av[Math.floor(Math.random()*av.length)];
            } else {
                let bestS = -Infinity;
                for(let i=0; i<9; i++) {
                    if(board[i] === "") {
                        board[i] = "O"; let s = minimax(board, 0, false); board[i] = "";
                        if(s > bestS) { bestS = s; m = i; }
                    }
                }
            }
            if(m !== undefined) makeMove(m);
        }

        function minimax(b, d, isMax) {
            if(checkWin(b, "O")) return 10; if(checkWin(b, "X")) return -10; if(d > 4) return 0;
            let best = isMax ? -Infinity : Infinity;
            for(let i=0; i<9; i++) {
                if(b[i] === "") {
                    b[i] = isMax ? "O" : "X";
                    let s = minimax(b, d+1, !isMax);
                    b[i] = ""; best = isMax ? Math.max(best, s) : Math.min(best, s);
                }
            }
            return best;
        }

        function exportWords() {
            const blob = new Blob([document.getElementById('vIn').value], {type: 'text/plain'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = 'my_words.txt'; a.click();
        }

        function importWords(input) {
            const reader = new FileReader();
            reader.onload = e => { document.getElementById('vIn').value = e.target.result; localStorage.setItem('ttt_vocab', e.target.result); };
            reader.readAsText(input.files[0]);
        }
    </script>
</body>
</html>
