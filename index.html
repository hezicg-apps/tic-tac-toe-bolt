<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Tic Tac Toe - V3.2 Deluxe</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body, html { background: #000; color: #fff; font-family: 'Varela Round', sans-serif; margin: 0; padding: 0; height: 100%; overflow: hidden; position: fixed; width: 100%; }
        .grid-container { display: grid; grid-template-columns: 40px 300px; grid-template-rows: 40px 300px; gap: 10px; margin: 0 auto; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); width: 300px; height: 300px; position: relative; }
        .board::before, .board::after { content: ''; position: absolute; background: #fff; border-radius: 10px; }
        .board::before { width: 4px; height: 100%; left: 33%; box-shadow: 100px 0 0 #fff; }
        .board::after { height: 4px; width: 100%; top: 33%; box-shadow: 0 100px 0 #fff; }
        .cell { display: flex; align-items: center; justify-content: center; font-size: 4rem; font-weight: bold; width: 100px; height: 100px; cursor: pointer; z-index: 10; }
        .x-neon { color: #00f2ff; text-shadow: 0 0 15px #00f2ff; }
        .o-neon { color: #bc13fe; text-shadow: 0 0 15px #bc13fe; }
        .ghost { opacity: 0.3; }
        .help-btn {
            position: absolute; top: 20px; left: 20px; width: 50px; height: 50px; border-radius: 50%;
            border: 2px solid #fff; color: #00f2ff; display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: bold; z-index: 100; box-shadow: 0 0 15px #00f2ff;
            animation: pulse-glow 2s infinite; cursor: pointer;
        }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 5px #00f2ff; transform: scale(1); } 50% { box-shadow: 0 0 20px #00f2ff; transform: scale(1.1); } }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .axis-label { color: #666; font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    </style>
</head>
<body>

    <div id="lobby" class="modal" style="display: flex;">
        <div class="help-btn" onclick="showModal('helpModal')">?</div>
        <h1 class="text-[#00f2ff] text-6xl font-black italic mb-2 tracking-tighter">SUPER</h1>
        <h1 class="text-[#bc13fe] text-4xl font-black italic mb-10 tracking-tighter">TIC TAC TOE</h1>
        <button onclick="showModal('vocabModal')" class="w-72 py-4 mb-4 rounded-2xl border-2 border-[#facc15] text-[#facc15] font-bold">הכנסת מילים</button>
        <button onclick="startGame('pvp')" class="w-72 py-4 mb-4 rounded-2xl bg-white text-black font-bold">2 שחקנים (בכיתה)</button>
        <div class="flex gap-2">
            <button onclick="startGame('pvc', 'easy')" class="w-35 px-6 py-4 rounded-2xl bg-zinc-800 text-white font-bold">מחשב קל</button>
            <button onclick="startGame('pvc', 'hard')" class="w-35 px-6 py-4 rounded-2xl bg-[#00f2ff] text-black font-bold">מחשב קשה</button>
        </div>
    </div>

    <div id="gameUI" class="hidden flex-col items-center justify-center h-full">
        <div id="statusHeader" class="mb-8 text-2xl font-bold italic">תור: <span id="turnInfo"></span></div>
        <div class="grid-container">
            <div></div>
            <div class="grid grid-cols-3 w-full"><div class="axis-label">1</div><div class="axis-label">2</div><div class="axis-label">3</div></div>
            <div class="flex flex-col h-full justify-around py-4"><div class="axis-label">A</div><div class="axis-label">B</div><div class="axis-label">C</div></div>
            <div class="board" id="mainBoard"></div>
        </div>
        <button onclick="location.reload()" class="mt-12 text-zinc-600 underline">חזרה לתפריט</button>
    </div>

    <div id="quizModal" class="modal">
        <div id="qText" class="text-6xl font-black mb-16 italic text-center px-6"></div>
        <div id="qOptions" class="flex flex-col gap-4 w-72"></div>
    </div>

    <div id="vocabModal" class="modal">
        <div class="bg-zinc-900 p-8 rounded-[40px] border-2 border-[#facc15] w-80">
            <h2 class="text-[#facc15] text-xl font-bold text-center mb-4">הכנסת מילים</h2>
            <textarea id="vIn" placeholder="dog - כלב" class="w-full h-48 bg-black text-white p-4 rounded-2xl border border-zinc-800 text-right mb-4 outline-none"></textarea>
            <button onclick="saveVocab()" class="w-full py-4 bg-[#facc15] text-black font-bold rounded-2xl">שמור</button>
        </div>
    </div>

    <div id="helpModal" class="modal px-6 text-right">
        <div class="bg-zinc-900 p-8 rounded-[40px] border-2 border-[#00f2ff] max-w-sm">
            <h2 class="text-[#00f2ff] text-2xl font-bold text-center mb-6">חוקי המשחק</h2>
            <p dir="rtl" class="text-zinc-300 space-y-4">לאחר 3 תורים, הסימן הראשון שלכם ייעלם. שימו לב לסימנים השקופים!</p>
            <button onclick="hideModal('helpModal')" class="mt-8 bg-white text-black font-bold py-4 rounded-2xl w-full">הבנתי</button>
        </div>
    </div>

    <script>
        let vocab = [], gameMode = 'pvp', difficulty = 'hard', board = Array(9).fill(""), history = {X:[], O:[]}, turn = "X", canMove = false;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq, type, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        const showModal = id => document.getElementById(id).style.display = 'flex';
        const hideModal = id => document.getElementById(id).style.display = 'none';

        function saveVocab() {
            const raw = document.getElementById('vIn').value;
            vocab = raw.split('\n').map(l => {
                const p = l.split('-');
                return p.length === 2 ? { en: p[0].trim(), he: p[1].trim() } : null;
            }).filter(x => x);
            if(vocab.length < 3) alert("הזן 3 מילים לפחות"); else hideModal('vocabModal');
        }

        function startGame(mode, diff = 'hard') {
            if(vocab.length < 3) { showModal('vocabModal'); return; }
            gameMode = mode; difficulty = diff;
            hideModal('lobby'); document.getElementById('gameUI').classList.replace('hidden', 'flex');
            initBoard(); startTurn();
        }

        function initBoard() {
            const b = document.getElementById('mainBoard'); b.innerHTML = '';
            for(let i=0; i<9; i++) {
                const c = document.createElement('div'); c.className = 'cell';
                c.onclick = () => { if(canMove && board[i] === "") makeMove(i); };
                b.appendChild(c);
            }
        }

        function startTurn() {
            if (gameMode === 'pvc' && turn === 'O') {
                document.getElementById('statusHeader').textContent = "המחשב חושב...";
                setTimeout(aiAction, 1000);
            } else {
                document.getElementById('statusHeader').innerHTML = `תור: <span id="turnInfo" class="${turn==='X'?'x-neon':'o-neon'}">${turn}</span>`;
                showQuiz();
            }
        }

        function showQuiz() {
            const item = vocab[Math.floor(Math.random() * vocab.length)];
            const opts = [item.he];
            while(opts.length < Math.min(4, vocab.length)) {
                const r = vocab[Math.floor(Math.random()*vocab.length)].he;
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => Math.random() - 0.5);
            document.getElementById('qText').textContent = item.en;
            document.getElementById('qText').className = `text-6xl font-black mb-16 italic ${turn==='X'?'x-neon':'o-neon'}`;
            const container = document.getElementById('qOptions'); container.innerHTML = '';
            opts.forEach(o => {
                const btn = document.createElement('button');
                btn.className = 'w-full py-5 rounded-2xl border-2 border-zinc-800 text-white text-xl font-bold';
                btn.textContent = o;
                btn.onclick = () => {
                    if(o === item.he) {
                        playSound(880, 'sine', 0.2); btn.style.borderColor = '#22c55e';
                        setTimeout(() => { hideModal('quizModal'); canMove = true; }, 600);
                    } else {
                        playSound(220, 'square', 0.3); btn.style.borderColor = '#ef4444';
                        document.getElementById('quizModal').classList.add('shake');
                        setTimeout(() => { hideModal('quizModal'); document.getElementById('quizModal').classList.remove('shake'); switchTurn(); }, 800);
                    }
                };
                container.appendChild(btn);
            });
            showModal('quizModal');
        }

        function makeMove(i) {
            board[i] = turn; history[turn].push(i);
            if(history[turn].length > 3) board[history[turn].shift()] = "";
            render();
            if(checkWin(board, turn)) {
                playSound(523, 'sine', 0.2); setTimeout(()=>playSound(659, 'sine', 0.2), 150); setTimeout(()=>playSound(783, 'sine', 0.4), 300);
                const end = Date.now() + 3000;
                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
                setTimeout(() => { alert(`ניצחון ל-${turn}!`); location.reload(); }, 1500);
                return;
            }
            canMove = false; switchTurn();
        }

        function switchTurn() { turn = turn === "X" ? "O" : "X"; render(); startTurn(); }

        function render() {
            document.querySelectorAll('.cell').forEach((c, i) => {
                const v = board[i]; c.textContent = v === "X" ? "✕" : (v === "O" ? "◯" : "");
                c.className = "cell " + (v === "X" ? "x-neon" : (v === "O" ? "o-neon" : ""));
                if(v && history[v].length === 3 && history[v][0] === i) c.classList.add('ghost');
            });
        }

        function checkWin(b, p) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(pats => pats.every(idx => b[idx] === p));
        }

        function aiAction() {
            let m;
            if(difficulty === 'easy') {
                const av = board.map((v,i)=>v===""?i:null).filter(v=>v!==null);
                m = av[Math.floor(Math.random()*av.length)];
            } else {
                let bestS = -Infinity;
                for(let i=0; i<9; i++) {
                    if(board[i] === "") {
                        board[i] = "O"; let s = minimax(board, 0, false); board[i] = "";
                        if(s > bestS) { bestS = s; m = i; }
                    }
                }
            }
            makeMove(m);
        }

        function minimax(b, d, isMax) {
            if(checkWin(b, "O")) return 10; if(checkWin(b, "X")) return -10; if(d > 3) return 0;
            let best = isMax ? -Infinity : Infinity;
            for(let i=0; i<9; i++) {
                if(b[i] === "") {
                    b[i] = isMax ? "O" : "X";
                    let s = minimax(b, d+1, !isMax);
                    b[i] = ""; best = isMax ? Math.max(best, s) : Math.min(best, s);
                }
            }
            return best;
        }
    </script>
</body>
</html>
