<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Tic Tac Toe</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body, html { 
            background: #1a7b4e; 
            color: #000; font-family: 'Varela Round', sans-serif; 
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden;
        }
        
        /* תפריט ראשי גמיש למניעת חפיפות */
        #lobby { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            text-align: center;
            height: 100%;
            padding: 40px 20px 20px 20px;
        }

        .lobby-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        
        /* כותרת בבלוק אחיד */
        .title-container {
            width: 280px;
            display: flex;
            flex-direction: column;
            margin-bottom: 2.5rem;
            position: relative;
        }
        
        /* כפתור עזרה - מוזז למעלה כדי לא להפריע לטקסט */
        .help-trigger {
            position: absolute;
            top: -45px;
            left: 0;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #fff;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }

        .title-super {
            font-size: 3.8rem;
            font-weight: 900;
            font-style: italic;
            line-height: 0.9;
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        .title-ttt {
            font-size: 2.1rem;
            font-weight: 900;
            font-style: italic;
            line-height: 1;
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 5px;
        }

        /* כפתורים */
        .btn-main { 
            width: 280px; 
            min-height: 55px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 12px; 
            font-weight: 900; 
            margin-bottom: 12px; 
            border: 3px solid #000; 
            cursor: pointer; 
            background: #fff; 
            transition: transform 0.1s;
            padding: 5px 15px;
            font-size: 1.1rem;
        }
        .btn-main:active { transform: scale(0.95); }

        /* לוח משחק */
        .super-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            padding: 4px;
            background: #000;
            border: 4px solid #000;
            border-radius: 4px;
            width: 90vw;
            max-width: 350px;
            aspect-ratio: 1 / 1;
            margin: 10px auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
        }

        .mini-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            background: #fff;
            border: 1px solid #000;
            position: relative;
        }

        .cell {
            background: #fff;
            border: 0.5px solid #ccc;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            cursor: pointer;
            line-height: 1;
        }

        .active-mini {
            background: #fff9c4;
            box-shadow: inset 0 0 10px rgba(251, 192, 45, 0.5);
            outline: 3px solid #fbc02d;
            z-index: 50;
        }

        .x-sign { color: #1976d2; }
        .o-sign { color: #d32f2f; }

        .mini-win {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 6.5rem; z-index: 20;
            background: rgba(255,255,255,0.9);
            font-weight: 900;
        }

        /* מודאלים */
        .modal { 
            position: fixed; inset: 0; 
            background: rgba(26, 123, 78, 0.98); 
            z-index: 2000; display: none; flex-direction: column; 
            align-items: center; justify-content: center; padding: 20px; 
        }
        
        .glow-q-btn {
            width: 70px; height: 70px; border-radius: 50%;
            background: #fff; border: 4px solid #000;
            font-size: 2.8rem; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; margin-bottom: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        
        .q-x { color: #1976d2; border-color: #1976d2; }
        .q-o { color: #d32f2f; border-color: #d32f2f; }

        #statusHeader { 
            font-size: 3rem; 
            font-weight: 900; 
            margin-top: 10px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.3);
        }

        /* Footer משופר שלא נדבק לכפתורים */
        .footer {
            width: 100%;
            padding: 10px 0;
            font-size: 0.75rem; 
            font-weight: bold; 
            color: rgba(255,255,255,0.7);
            text-align: center;
        }

        .back-btn { position: absolute; top: 15px; right: 15px; font-size: 2rem; cursor: pointer; color: #fff; z-index: 100; }
    </style>
</head>
<body>

    <!-- מסך פתיחה -->
    <div id="lobby">
        <div class="lobby-content">
            <div class="title-container">
                <div class="help-trigger" onclick="alert('הסבר: עליך לנצח בלוחות קטנים כדי לסמן X או O בלוח הגדול. המהלך שלך קובע באיזה לוח היריב ישחק בשלב הבא!')">?</div>
                <div class="title-super text-white">
                    <span>S</span><span>U</span><span>P</span><span>E</span><span>R</span>
                </div>
                <div class="title-ttt text-white">
                    <span>TIC</span><span>TAC</span><span>TOE</span>
                </div>
            </div>
            
            <button onclick="showModal('vocabModal')" class="btn-main">הכנסת מילים / ייבוא</button>
            <button onclick="startGame('pvp')" class="btn-main text-blue-600">שחקן נגד שחקן</button>
            <button onclick="startGame('pvc')" class="btn-main text-red-600">שחקן נגד מחשב</button>
        </div>
        
        <div class="footer">Super Tic Tac Toe Bolt © פיתוח חזי כהן גלמן 2026</div>
    </div>

    <!-- ממשק משחק -->
    <div id="gameUI" class="hidden flex-col items-center justify-between h-full py-8">
        <div onclick="location.reload()" class="back-btn">➔</div>
        
        <div id="quizTrigger" onclick="showQuiz()" class="glow-q-btn hidden">?</div>

        <div id="superBoard" class="super-board"></div>

        <div id="statusHeader" class="text-center">תור X</div>
    </div>

    <!-- מודאל שאלה -->
    <div id="quizModal" class="modal">
        <div id="qText" class="text-white text-5xl font-black mb-12 italic text-center"></div>
        <div id="qOptions" class="flex flex-col gap-4 w-72"></div>
    </div>

    <!-- מודאל מילים -->
    <div id="vocabModal" class="modal">
        <div onclick="hideModal('vocabModal')" class="back-btn">➔</div>
        <h2 class="text-white text-2xl font-black mb-4 text-center">הכנסת רשימת מילים</h2>
        <textarea id="vIn" oninput="localStorage.setItem('sttt_vocab', this.value)" placeholder="apple - תפוח" class="w-80 h-64 bg-white border-2 border-black text-black p-4 rounded-xl mb-4 text-right outline-none"></textarea>
        <button onclick="hideModal('vocabModal')" class="btn-main bg-black text-white border-none">שמור וחזור</button>
    </div>

    <script>
        let vocab = [], turn = "X", activeBoard = -1, canMove = false, gameMode = 'pvp';
        let superData = Array(9).fill(null).map(() => Array(9).fill(""));
        let miniWinners = Array(9).fill("");

        window.onload = () => {
            const saved = localStorage.getItem('sttt_vocab');
            if(saved) document.getElementById('vIn').value = saved;
        };

        const showModal = id => {
            const m = document.getElementById(id);
            m.style.display = 'flex';
        };
        const hideModal = id => document.getElementById(id).style.display = 'none';

        function startGame(mode) {
            const raw = document.getElementById('vIn').value;
            vocab = raw.split('\n').map(l => {
                const p = l.split(/[–\-\—:]/);
                return p.length >= 2 ? { en: p[0].trim(), he: p[1].trim() } : null;
            }).filter(x => x);
            
            if(vocab.length < 2) { 
                alert("נא להכניס לפחות 2 מילים בפורמט: מילה - תרגום"); 
                return; 
            }
            
            gameMode = mode;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('gameUI').classList.replace('hidden', 'flex');
            createBoards();
            updateStatus();
            document.getElementById('quizTrigger').classList.remove('hidden');
        }

        function createBoards() {
            const container = document.getElementById('superBoard');
            container.innerHTML = '';
            for(let b=0; b<9; b++) {
                const mini = document.createElement('div');
                mini.id = `mini-${b}`;
                mini.className = 'mini-board';
                for(let c=0; c<9; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.onclick = () => handleCellClick(b, c);
                    mini.appendChild(cell);
                }
                container.appendChild(mini);
            }
            updateActiveHighlight();
        }

        function handleCellClick(boardIdx, cellIdx) {
            if(!canMove || miniWinners[boardIdx] !== "") return;
            if(activeBoard !== -1 && activeBoard !== boardIdx) return;
            if(superData[boardIdx][cellIdx] !== "") return;
            executeMove(boardIdx, cellIdx);
        }

        function executeMove(boardIdx, cellIdx) {
            superData[boardIdx][cellIdx] = turn;
            canMove = false;
            checkMiniWin(boardIdx);
            
            if(miniWinners[cellIdx] === "" && superData[cellIdx].some(c => c === "")) {
                activeBoard = cellIdx;
            } else {
                activeBoard = -1;
            }

            render();
            
            if(checkSuperWin()) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                setTimeout(() => { alert("ניצחון מוחץ ל-" + turn + "!"); location.reload(); }, 500);
                return;
            }

            turn = turn === "X" ? "O" : "X";
            updateStatus();
            if(gameMode === 'pvc' && turn === 'O') setTimeout(aiMove, 600);
            else document.getElementById('quizTrigger').classList.remove('hidden');
        }

        function aiMove() {
            let possibleBoards = activeBoard === -1 ? 
                miniWinners.map((w, i) => w === "" ? i : null).filter(v => v !== null) : 
                [activeBoard];
            let b = possibleBoards[Math.floor(Math.random() * possibleBoards.length)];
            let possibleCells = superData[b].map((v, i) => v === "" ? i : null).filter(v => v !== null);
            let c = possibleCells[Math.floor(Math.random() * possibleCells.length)];
            executeMove(b, c);
        }

        function showQuiz() {
            const item = vocab[Math.floor(Math.random() * vocab.length)];
            const opts = [item.he];
            while(opts.length < Math.min(4, vocab.length)) {
                const r = vocab[Math.floor(Math.random()*vocab.length)].he;
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => Math.random() - 0.5);
            
            document.getElementById('qText').textContent = item.en;
            const container = document.getElementById('qOptions'); container.innerHTML = '';
            opts.forEach(o => {
                const btn = document.createElement('button');
                btn.className = 'btn-main border-black w-full';
                btn.textContent = o;
                btn.onclick = () => {
                    if(o === item.he) {
                        hideModal('quizModal');
                        canMove = true;
                        document.getElementById('quizTrigger').classList.add('hidden');
                        updateActiveHighlight();
                    } else {
                        hideModal('quizModal');
                        turn = turn === "X" ? "O" : "X";
                        updateStatus();
                        if(gameMode === 'pvc' && turn === 'O') setTimeout(aiMove, 600);
                    }
                };
                container.appendChild(btn);
            });
            showModal('quizModal');
        }

        function checkMiniWin(bIdx) {
            if(checkCombo(superData[bIdx], turn)) miniWinners[bIdx] = turn;
        }

        function checkSuperWin() { return checkCombo(miniWinners, turn); }

        function checkCombo(arr, p) {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return wins.some(s => s.every(i => arr[i] === p));
        }

        function render() {
            for(let b=0; b<9; b++) {
                const mini = document.getElementById(`mini-${b}`);
                const cells = mini.querySelectorAll('.cell');
                superData[b].forEach((val, cIdx) => {
                    cells[cIdx].textContent = val === 'X' ? '✕' : (val === 'O' ? '◯' : '');
                    cells[cIdx].className = 'cell ' + (val === 'X' ? 'x-sign' : (val === 'O' ? 'o-sign' : ''));
                });
                if(miniWinners[b] !== "" && !mini.querySelector('.mini-win')) {
                    const winOverlay = document.createElement('div');
                    winOverlay.className = 'mini-win ' + (miniWinners[b] === 'X' ? 'x-sign' : 'o-sign');
                    winOverlay.textContent = miniWinners[b] === 'X' ? '✕' : '◯';
                    mini.appendChild(winOverlay);
                }
            }
            updateActiveHighlight();
        }

        function updateActiveHighlight() {
            for(let b=0; b<9; b++) {
                const mini = document.getElementById(`mini-${b}`);
                mini.classList.remove('active-mini');
                if(canMove && (activeBoard === -1 || activeBoard === b) && miniWinners[b] === "") {
                    mini.classList.add('active-mini');
                }
            }
        }

        function updateStatus() {
            const h = document.getElementById('statusHeader');
            const q = document.getElementById('quizTrigger');
            h.textContent = `תור ${turn}`;
            h.className = turn === 'X' ? 'x-sign' : 'o-sign';
            q.className = `glow-q-btn ${turn === 'X' ? 'q-x' : 'q-o'}`;
        }
    </script>
</body>
</html>
