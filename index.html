<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Tic Tac Toe - V2.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDqgGqCF5VzJ7I3x0O2DdQk7bY-ARajyE0",
            authDomain: "super-tic-tac-toe-57080.firebaseapp.com",
            projectId: "super-tic-tac-toe-57080",
            storageBucket: "super-tic-tac-toe-57080.firebasestorage.app",
            messagingSenderId: "32126067090",
            appId: "1:32126067090:web:517e9f90515eec6e0d614b"
        };
        
        // אתחול Firebase עם בדיקת שגיאות
        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        window.startOnline = async () => {
            const btn = document.getElementById('onlineBtn');
            if (!window.vocab || window.vocab.length < 3) {
                showStatusModal("נא להזין לפחות 3 מילים לפני תחילת המשחק");
                return;
            }

            try {
                btn.textContent = "מתחבר...";
                btn.disabled = true;

                const id = Math.random().toString(36).substring(2, 7).toUpperCase();
                window.gameId = id; window.myRole = "X"; window.mode = "online";
                
                await setDoc(doc(db, 'games', id), {
                    board: Array(9).fill(""), turn: "X", status: "waiting", 
                    vocabulary: window.vocab, history: {X:[], O:[]}, asking: false
                });
                
                const currentUrl = window.location.href.split('?')[0];
                document.getElementById('gameLink').value = `${currentUrl}?game=${id}`;
                document.getElementById('lobbyMain').style.display = 'none';
                document.getElementById('onlineWait').style.display = 'flex';
                document.getElementById('gameCodeText').textContent = id;
                
                listenToGame();
            } catch (err) {
                btn.textContent = "משחק אונליין (שלח לינק)";
                btn.disabled = false;
                showStatusModal("שגיאת תקשורת: וודא שיש אינטרנט ונסה שוב");
                console.error("Game Creation Failed:", err);
            }
        };

        window.joinGame = async (id) => {
            const cleanId = id?.trim().toUpperCase();
            if (!cleanId) return;
            try {
                const snap = await getDoc(doc(db, 'games', cleanId));
                if (snap.exists()) {
                    window.gameId = cleanId; window.myRole = "O"; window.mode = "online";
                    window.vocab = snap.data().vocabulary;
                    await updateDoc(doc(db, 'games', cleanId), { status: "playing" });
                    listenToGame();
                } else { showStatusModal("קוד משחק לא נמצא במערכת"); }
            } catch (err) { showStatusModal("שגיאה בהתחברות למשחק"); }
        };

        function listenToGame() {
            onSnapshot(doc(db, 'games', window.gameId), (snap) => {
                const data = snap.data();
                if (!data) return;
                window.state = data;
                if (data.status === "playing") {
                    document.getElementById('lobby').style.display = 'none';
                    document.getElementById('gameUI').style.display = 'flex';
                    render();
                    if (data.turn === window.myRole && !data.asking && !window.localAsking) {
                        window.localAsking = true;
                        updateDoc(doc(db, 'games', window.gameId), { asking: true });
                        setTimeout(ask, 400);
                    }
                }
            });
        }

        window.syncMove = async () => {
            await updateDoc(doc(db, 'games', window.gameId), {
                board: window.state.board, turn: window.state.turn, 
                history: window.state.history, asking: false
            });
            window.localAsking = false;
        };
    </script>

    <style>
        body, html { background: #000; color: #fff; font-family: 'Varela Round', sans-serif; margin: 0; padding: 0; height: 100%; overflow: hidden; position: fixed; width: 100%; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); width: 320px; height: 320px; margin: 0 auto; }
        .cell { display: flex; align-items: center; justify-content: center; font-size: 5rem; font-weight: bold; width: 106px; height: 106px; }
        .cell:nth-child(2), .cell:nth-child(5), .cell:nth-child(8) { border-left: 4px solid #fff; border-right: 4px solid #fff; }
        .cell:nth-child(4), .cell:nth-child(5), .cell:nth-child(6) { border-top: 4px solid #fff; border-bottom: 4px solid #fff; }
        .x-neon { color: #00f2ff; text-shadow: 0 0 15px #00f2ff; }
        .o-neon { color: #bc13fe; text-shadow: 0 0 15px #bc13fe; }
        .ghost { opacity: 0.2; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.05; } }
        .btn { width: 280px; height: 55px; border-radius: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; cursor: pointer; }
        .help-btn { position: absolute; top: 20px; left: 20px; width: 45px; height: 45px; border-radius: 50%; border: 2px solid #00f2ff; color: #00f2ff; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; z-index: 50; cursor: pointer; }
        .modal { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="lobby" class="modal">
        <div class="help-btn" onclick="showModal('helpModal')">?</div>
        
        <div id="lobbyMain" class="flex flex-col items-center">
            <h1 class="text-[#00f2ff] text-6xl font-black italic mb-2 tracking-tighter">SUPER</h1>
            <h1 class="text-[#bc13fe] text-4xl font-black italic mb-12 tracking-tighter">TIC TAC TOE</h1>
            
            <button onclick="showModal('vocabModal')" class="btn border-2 border-[#facc15] text-[#facc15] text-lg">לחצו להוספת מילים למשחק</button>
            <button id="onlineBtn" onclick="startOnline()" class="btn bg-[#facc15] text-black text-lg">משחק אונליין (שלח לינק)</button>
            
            <div class="mt-4 mb-2 text-zinc-600 text-sm">הקלידו קוד הצטרפות</div>
            <input type="text" id="joinInput" class="btn bg-transparent border-2 border-zinc-800 text-center text-white outline-none focus:border-[#facc15]">
            <button onclick="joinGame(document.getElementById('joinInput').value)" class="btn border-2 border-zinc-800 text-zinc-500">הצטרף</button>
        </div>

        <div id="onlineWait" style="display:none;" class="flex flex-col items-center px-8 text-center">
            <div id="gameCodeText" class="text-7xl font-bold text-[#facc15] mb-8"></div>
            <p class="text-zinc-400 mb-4">מחכה לחבר/ה...</p>
            <input type="text" id="gameLink" readonly class="w-full p-3 bg-zinc-900 text-[10px] text-center mb-6 rounded-xl border border-zinc-800 text-zinc-500">
            <button onclick="copyLink()" class="btn bg-[#facc15] text-black w-full">העתק קישור</button>
        </div>
    </div>

    <div id="helpModal" style="display:none;" class="modal bg-black/95 px-6">
        <div class="bg-zinc-900 p-8 rounded-[30px] border-2 border-[#00f2ff] w-full max-w-xs relative">
            <h2 class="text-[#00f2ff] text-2xl font-bold text-center mb-8">חוקי המשחק</h2>
            <div class="space-y-6 text-right" dir="rtl">
                <p>🎯 עונים על שאלה באנגלית כדי לקבל תור.</p>
                <p>❌ מותר רק 3 סימנים על הלוח לכל שחקן.</p>
                <p>⚠️ הסימן הרביעי ימחוק את הסימן הישן שלך!</p>
            </div>
            <button onclick="hideModal('helpModal')" class="mt-10 bg-[#facc15] text-black font-bold py-4 rounded-2xl w-full">הבנתי!</button>
        </div>
    </div>

    <div id="vocabModal" style="display:none;" class="modal bg-black/95">
        <div class="bg-zinc-900 p-6 rounded-[30px] border-2 border-[#facc15] w-80">
            <h2 class="text-[#facc15] text-xl font-bold text-center mb-4">הזנת מילים למשחק</h2>
            <textarea id="vIn" placeholder="dog - כלב" class="w-full h-48 bg-black text-white p-4 rounded-2xl border border-zinc-800 text-right mb-4 outline-none"></textarea>
            <button onclick="saveVocab()" class="btn bg-[#facc15] text-black w-full">שמור מילים</button>
        </div>
    </div>

    <div id="gameUI" style="display:none;" class="flex flex-col h-full">
        <div class="h-24 flex items-center justify-center border-b border-zinc-900">
            <h2 id="turnText" class="text-3xl font-black italic">תור השחקן <span id="turnIcon"></span></h2>
        </div>
        <div class="flex-grow flex items-center justify-center">
            <div class="board">
                <div class="cell" onclick="cellTap(0)"></div><div class="cell" onclick="cellTap(1)"></div><div class="cell" onclick="cellTap(2)"></div>
                <div class="cell" onclick="cellTap(3)"></div><div class="cell" onclick="cellTap(4)"></div><div class="cell" onclick="cellTap(5)"></div>
                <div class="cell" onclick="cellTap(6)"></div><div class="cell" onclick="cellTap(7)"></div><div class="cell" onclick="cellTap(8)"></div>
            </div>
        </div>
    </div>

    <div id="quiz" style="display:none;" class="modal bg-black/98">
        <div id="qW" class="text-6xl font-black mb-16 italic"></div>
        <div id="opts" class="flex flex-col items-center w-full px-10"></div>
    </div>

    <div id="statusModal" style="display:none;" class="modal bg-black/90">
        <div class="bg-zinc-900 p-8 rounded-3xl text-center">
            <p id="statusMsg" class="text-xl mb-6"></p>
            <button onclick="hideModal('statusModal')" class="btn bg-[#facc15] text-black w-full">אישור</button>
        </div>
    </div>

    <script>
        window.vocab = [];
        window.state = { board: Array(9).fill(""), turn: "X", history: {X:[], O:[]}, canMove: false };
        window.localAsking = false;

        const showModal = (id) => document.getElementById(id).style.display = 'flex';
        const hideModal = (id) => document.getElementById(id).style.display = 'none';
        const showStatusModal = (msg) => { document.getElementById('statusMsg').textContent = msg; showModal('statusModal'); };

        function saveVocab() {
            const raw = document.getElementById('vIn').value;
            window.vocab = raw.split('\n').map(l => {
                const p = l.split('-');
                return p.length === 2 ? { en: p[0].trim(), he: p[1].trim() } : null;
            }).filter(x => x);
            if(window.vocab.length >= 3) hideModal('vocabModal');
        }

        function copyLink() {
            const el = document.getElementById('gameLink');
            el.select();
            document.execCommand('copy');
            showStatusModal("הקישור הועתק!");
        }

        function ask() {
            const item = vocab[Math.floor(Math.random()*vocab.length)];
            const options = [item.he];
            while(options.length < Math.min(4, vocab.length)) {
                const r = vocab[Math.floor(Math.random()*vocab.length)].he;
                if(!options.includes(r)) options.push(r);
            }
            options.sort(() => Math.random() - 0.5);

            document.getElementById('qW').textContent = item.en;
            document.getElementById('qW').className = `text-6xl font-black mb-16 italic ${state.turn==='X'?'x-neon':'o-neon'}`;
            
            const container = document.getElementById('opts'); container.innerHTML = '';
            options.forEach(o => {
                const b = document.createElement('button');
                b.className = 'btn border-2 border-zinc-800 text-white w-full text-xl'; b.textContent = o;
                b.onclick = async () => {
                    if(o === item.he) {
                        b.style.borderColor = '#22c55e'; b.style.color = '#22c55e';
                        setTimeout(() => { hideModal('quiz'); window.state.canMove = true; }, 600);
                    } else {
                        b.style.borderColor = '#ef4444'; b.style.color = '#ef4444';
                        setTimeout(async () => { 
                            hideModal('quiz'); 
                            window.state.turn = window.state.turn === "X" ? "O" : "X";
                            if(window.mode === 'online') await window.syncMove();
                            else render(); 
                        }, 1000);
                    }
                };
                container.appendChild(b);
            });
            showModal('quiz');
        }

        async function cellTap(i) {
            if (!window.state.canMove || window.state.board[i] !== "") return;
            if (window.mode === "online" && window.state.turn !== window.myRole) return;

            window.state.board[i] = window.state.turn;
            window.state.history[window.state.turn].push(i);
            if(window.state.history[window.state.turn].length > 3) {
                const old = window.state.history[window.state.turn].shift();
                window.state.board[old] = "";
            }
            
            window.state.canMove = false;
            if(checkWin()) {
                confetti(); showStatusModal(`ניצחון ל-${window.state.turn}!`);
                setTimeout(()=>location.reload(), 4000);
            } else {
                window.state.turn = window.state.turn === "X" ? "O" : "X";
                if (window.mode === "online") await window.syncMove();
                render();
            }
        }

        function render() {
            const isX = window.state.turn === 'X';
            const icon = document.getElementById('turnIcon');
            icon.textContent = isX ? "X" : "O";
            icon.className = isX ? "x-neon" : "o-neon";
            
            document.querySelectorAll('.cell').forEach((c, i) => {
                const val = window.state.board[i];
                c.textContent = val === "X" ? "✕" : (val === "O" ? "◯" : "");
                let cls = val === 'X' ? 'x-neon' : (val === 'O' ? 'o-neon' : '');
                if (val && window.state.history[val].length === 3 && window.state.history[val][0] === i) cls += " ghost";
                c.className = "cell " + cls;
            });
        }

        function checkWin() {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return wins.some(p => window.state.board[p[0]] && window.state.board[p[0]] === window.state.board[p[1]] && window.state.board[p[0]] === window.state.board[p[2]]);
        }

        window.onload = () => {
            const p = new URLSearchParams(window.location.search);
            if (p.get('game')) window.joinGame(p.get('game'));
        };
    </script>
</body>
</html>
