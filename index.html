<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe Bolt v. 3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body, html { 
            background: #000; 
            color: #fff; 
            font-family: 'Varela Round', sans-serif; 
            margin: 0; padding: 0; 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            position: fixed; 
        }
        
        #lobby { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            text-align: center;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .lobby-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            gap: 30px;
        }

        .logo-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%;
            direction: ltr; 
        }

        /* אפקט הבהוב ניאון תכלת לכותרת */
        .neon-glow-text {
            color: #00f2ff;
            text-shadow: 0 0 5px #00f2ff, 0 0 10px #00f2ff;
            animation: neon-pulse 2s infinite ease-in-out;
            white-space: nowrap; /* שורה אחת בלבד */
        }

        @keyframes neon-pulse {
            0%, 100% { opacity: 1; text-shadow: 0 0 10px #00f2ff, 0 0 20px #00f2ff; }
            50% { opacity: 0.8; text-shadow: 0 0 2px #00f2ff, 0 0 5px #00f2ff; }
        }

        .bolt-title {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 0.8;
            letter-spacing: -2px;
            margin-top: -10px;
        }

        .bolt-o {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .lightning-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-45%, -50%);
            font-size: 0.45em; 
            color: #ff9d00;
            text-shadow: 0 0 15px #ff9d00;
            z-index: 5;
            pointer-events: none;
        }

        .game-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; width: 100%; }
        
        #statusHeader { margin-top: 40px; margin-bottom: 10px; }
        .back-btn { position: absolute; top: 15px; right: 15px; font-size: 2rem; z-index: 100; cursor: pointer; color: #444; transform: scaleX(-1); }

        .board { 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            width: 85vw; height: 85vw; max-width: 320px; max-height: 320px; 
            position: relative;
        }
        
        .grid-line-v { position: absolute; background: #fff; width: 5px; height: 100%; top: 0; border-radius: 10px; box-shadow: 0 0 10px #fff; }
        .grid-line-h { position: absolute; background: #fff; height: 5px; width: 100%; left: 0; border-radius: 10px; box-shadow: 0 0 10px #fff; }
        
        .cell { display: flex; align-items: center; justify-content: center; font-size: 4.5rem; font-weight: 900; cursor: pointer; z-index: 10; line-height: 1; }
        .x-lightsaber { color: #fff; text-shadow: 0 0 7px #fff, 0 0 15px #fff, 0 0 25px #00f2ff, 0 0 45px #00f2ff; }
        .o-lightsaber { color: #fff; text-shadow: 0 0 7px #fff, 0 0 15px #fff, 0 0 25px #bc13fe, 0 0 45px #bc13fe; }
        
        .btn-main { width: 100%; max-width: 280px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 20px; font-weight: 900; border: 2px solid; cursor: pointer; background: transparent; font-size: 1.1rem; transition: all 0.2s; }
        .btn-main:active { transform: scale(0.95); }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        .glow-q-btn {
            width: 75px; height: 75px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05); border: 4px solid #facc15;
            color: #facc15; font-size: 3rem; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; animation: question-pulse 2s infinite;
            margin-top: 20px;
        }

        @keyframes question-pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 10px #facc15; } 50% { transform: scale(1.1); box-shadow: 0 0 30px #facc15; } }

        .footer {
            width: 100%;
            padding: 15px 0;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            text-align: center;
            direction: rtl;
        }

        /* עיצוב סימן השאלה - מוזז לשמאל כדי לא להפריע לטקסט */
        .help-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #00f2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00f2ff;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
            z-index: 50;
        }

        .timer-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 5px;
            background: #f97316;
            width: 0%;
            z-index: 3000;
            transition: width 0.1s linear;
        }

        * { -webkit-tap-highlight-color: transparent; user-select: none; }
    </style>
</head>
<body>

    <div id="speedTimer" class="timer-bar"></div>

    <div id="lobby">
        <!-- סימן שאלה בצד שמאל -->
        <div onclick="showModal('helpModal')" class="help-btn">?</div>
        
        <div class="lobby-content">
            <div class="logo-container" dir="ltr">
                <!-- כותרת בשורה אחת עם אפקט הבהוב תכלת -->
                <h1 class="neon-glow-text text-4xl sm:text-5xl font-black italic tracking-tighter mb-2">TIC TAC TOE</h1>
                <div class="bolt-title text-[#facc15] text-8xl sm:text-9xl font-black italic" style="text-shadow: 0 0 25px rgba(250, 204, 21, 0.6);">
                    B<span class="bolt-o">O<span class="lightning-icon">⚡</span></span>LT
                </div>
            </div>
            
            <div class="flex flex-col gap-4 w-full items-center">
                <button onclick="showModal('vocabModal')" class="btn-main border-[#facc15] text-[#facc15]">הכנסת מילים / ייבוא</button>
                <button onclick="startGame('pvp')" class="btn-main border-white text-white">2 שחקנים</button>
                <button onclick="startGame('speed')" class="btn-main border-orange-500 text-orange-500">Speed Run ⚡</button>
                <button onclick="showModal('aiDifficultyModal')" class="btn-main border-[#bc13fe] text-[#bc13fe]">נגד המחשב</button>
            </div>
        </div>

        <div class="footer">Tic Tac Toe Bolt © פיתוח חזי כהן גלמן 2026</div>
    </div>

    <div id="gameUI" class="hidden flex-col items-center h-full">
        <div onclick="location.reload()" class="back-btn">➔</div>
        <div id="statusHeader" class="text-4xl font-black italic"></div>
        <div class="game-wrapper">
            <div id="mainBoard" class="board">
                <div class="grid-line-v" style="left: 33.33%;"></div>
                <div class="grid-line-v" style="left: 66.66%;"></div>
                <div class="grid-line-h" style="top: 33.33%;"></div>
                <div class="grid-line-h" style="top: 66.66%;"></div>
            </div>
            <div id="nextQuestionBtn" onclick="showQuiz()" class="glow-q-btn hidden">?</div>
        </div>
    </div>

    <div id="quizModal" class="modal">
        <div id="qText" class="text-5xl font-black mb-8 italic text-center" dir="ltr"></div>
        <div id="qOptions" class="flex flex-col gap-3 w-full max-w-xs"></div>
    </div>

    <div id="vocabModal" class="modal">
        <h2 class="text-[#facc15] text-2xl font-black mb-4 italic">רשימת מילים</h2>
        <textarea id="vIn" oninput="localStorage.setItem('ttt_vocab', this.value)" placeholder="apple - תפוח" class="w-full max-w-xs h-64 bg-black border-2 border-zinc-800 text-white p-4 rounded-2xl mb-4 text-right outline-none"></textarea>
        <div class="flex gap-2 w-full max-w-xs">
            <button onclick="hideModal('vocabModal')" class="btn-main bg-[#facc15] text-black border-none h-14 w-full">שמור</button>
        </div>
    </div>

    <div id="winModal" class="modal text-center">
        <h2 id="winTitle" class="text-5xl font-black mb-6"></h2>
        <div id="winnerIcon" class="text-8xl mb-8"></div>
        <button onclick="location.reload()" class="btn-main border-[#facc15] text-[#facc15]">משחק חדש</button>
    </div>

    <div id="helpModal" class="modal">
        <div class="bg-zinc-900 p-6 rounded-3xl border-2 border-[#00f2ff] max-w-xs text-center">
            <h2 class="text-[#00f2ff] text-xl font-black mb-4">איך משחקים?</h2>
            <ul class="text-right text-base space-y-3 mb-6 text-white">
                <li>⚡ <b>3 סימנים בלבד:</b> כשתשימו את הרביעי, הראשון יעלם.</li>
                <li>⚡ <b>חידון:</b> בכל תור צריך לענות נכון כדי לבצע מהלך.</li>
                <li>⚡ <b>Speed:</b> במצב זה יש לכם רק 4 שניות לענות!</li>
            </ul>
            <button onclick="hideModal('helpModal')" class="btn-main bg-[#00f2ff] text-black border-none w-full">הבנתי!</button>
        </div>
    </div>

    <div id="aiDifficultyModal" class="modal">
        <h2 class="text-white text-2xl font-black mb-6 italic">בחר רמה</h2>
        <button onclick="hideModal('aiDifficultyModal'); startGame('pvc', 'easy')" class="btn-main border-[#00f2ff] text-[#00f2ff] mb-3">קל</button>
        <button onclick="hideModal('aiDifficultyModal'); startGame('pvc', 'hard')" class="btn-main border-[#bc13fe] text-[#bc13fe]">מאתגר</button>
    </div>

    <script>
        let vocab = [], gameMode = 'pvp', difficulty = 'hard', board = Array(9).fill(""), history = {X:[], O:[]}, turn = "X", canMove = false, isGameOver = false;
        let timeLeft = 100, speedInterval;

        window.onload = () => {
            const saved = localStorage.getItem('ttt_vocab');
            if(saved) document.getElementById('vIn').value = saved;
        };

        const showModal = id => document.getElementById(id).style.display = 'flex';
        const hideModal = id => document.getElementById(id).style.display = 'none';

        function parseVocab() {
            const raw = document.getElementById('vIn').value;
            vocab = raw.split('\n').map(l => {
                const p = l.split(/[–\-\—:]/);
                return p.length >= 2 ? { en: p[0].trim(), he: p[1].trim() } : null;
            }).filter(x => x);
            return vocab.length >= 2;
        }

        function startGame(mode, diff = 'hard') {
            if(!parseVocab()) { alert("נא להכניס לפחות 2 מילים בפורמט: word - פירוש"); return; }
            gameMode = mode; difficulty = diff;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('gameUI').classList.replace('hidden', 'flex');
            initBoard(); startTurn();
        }

        function initBoard() {
            const b = document.getElementById('mainBoard');
            const existingCells = b.querySelectorAll('.cell');
            existingCells.forEach(c => c.remove());
            
            for(let i=0; i<9; i++) {
                const c = document.createElement('div'); c.className = 'cell';
                c.onclick = () => { if(canMove && !isGameOver) makeMove(i); };
                b.appendChild(c);
            }
        }

        function startTurn() {
            if(isGameOver) return;
            const btn = document.getElementById('nextQuestionBtn');
            const cls = turn === 'X' ? 'x-lightsaber' : 'o-lightsaber';
            document.getElementById('statusHeader').innerHTML = `<span class="${cls}">תור ${turn}</span>`;
            btn.classList.remove('hidden');
            if(gameMode === 'pvc' && turn === 'O') setTimeout(aiAction, 800);
        }

        function showQuiz() {
            const item = vocab[Math.floor(Math.random() * vocab.length)];
            const opts = [item.he];
            while(opts.length < Math.min(4, vocab.length)) {
                const r = vocab[Math.floor(Math.random()*vocab.length)].he;
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => Math.random() - 0.5);
            const qT = document.getElementById('qText');
            qT.textContent = item.en;
            qT.className = `text-5xl font-black mb-8 italic text-center ${turn==='X'?'text-[#00f2ff]':'text-[#bc13fe]'}`;
            const container = document.getElementById('qOptions'); container.innerHTML = '';
            opts.forEach(o => {
                const btn = document.createElement('button');
                btn.className = 'option-btn border-2 border-zinc-700 p-4 rounded-2xl font-bold text-xl text-white active:bg-zinc-800';
                btn.textContent = o;
                btn.onclick = () => handleAnswer(o === item.he, btn);
                container.appendChild(btn);
            });
            showModal('quizModal');
            if(gameMode === 'speed') startTimer();
        }

        function startTimer() {
            timeLeft = 100;
            document.getElementById('speedTimer').style.width = "100%";
            clearInterval(speedInterval);
            speedInterval = setInterval(() => {
                timeLeft -= 2.5; // 4 שניות בסה"כ
                document.getElementById('speedTimer').style.width = timeLeft + "%";
                if(timeLeft <= 0) { clearInterval(speedInterval); handleAnswer(false, null); }
            }, 100);
        }

        function handleAnswer(isCorrect, clickedBtn) {
            clearInterval(speedInterval);
            document.getElementById('speedTimer').style.width = "0%";
            if(isCorrect) {
                if(clickedBtn) clickedBtn.classList.add('bg-green-600', 'border-green-400');
                setTimeout(() => { hideModal('quizModal'); canMove = true; document.getElementById('nextQuestionBtn').classList.add('hidden'); }, 300);
            } else {
                if(clickedBtn) clickedBtn.classList.add('bg-red-600', 'border-red-400');
                setTimeout(() => { hideModal('quizModal'); switchTurn(); }, 600);
            }
        }

        function makeMove(i) {
            if(board[i] !== "") return;
            board[i] = turn; history[turn].push(i);
            if(checkWin(board, turn)) { isGameOver = true; render(); triggerWin(); return; }
            if(history[turn].length > 3) board[history[turn].shift()] = "";
            render(); canMove = false; switchTurn();
        }

        function triggerWin() {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            const title = document.getElementById('winTitle');
            title.textContent = `ניצחון ל-${turn}!`;
            title.className = `text-5xl font-black mb-6 ${turn==='X'?'x-lightsaber':'o-lightsaber'}`;
            document.getElementById('winnerIcon').textContent = turn === 'X' ? '✕' : '◯';
            document.getElementById('winnerIcon').className = `text-8xl mb-8 ${turn==='X'?'x-lightsaber':'o-lightsaber'}`;
            setTimeout(() => showModal('winModal'), 500);
        }

        function switchTurn() { turn = turn === "X" ? "O" : "X"; render(); startTurn(); }

        function render() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((c, i) => {
                const v = board[i]; c.textContent = v === "X" ? "✕" : (v === "O" ? "◯" : "");
                c.className = "cell " + (v === "X" ? "x-lightsaber" : (v === "O" ? "o-lightsaber" : ""));
                if(v && !isGameOver && history[v].length === 3 && history[v][0] === i) c.style.opacity = "0.3"; else c.style.opacity = "1";
            });
        }

        function checkWin(b, p) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(pats => pats.every(idx => b[idx] === p));
        }

        function aiAction() {
            if(!canMove) showQuiz();
            else {
                let available = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
                if(available.length > 0) makeMove(available[Math.floor(Math.random() * available.length)]);
            }
        }
    </script>
</body>
</html>
