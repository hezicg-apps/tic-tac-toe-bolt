<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Tic Tac Toe - Complete Modal System</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body, html { background: #000; color: #fff; font-family: 'Varela Round', sans-serif; margin: 0; padding: 0; height: 100%; overflow: hidden; position: fixed; width: 100%; }
        
        .grid-container { 
            display: grid; grid-template-columns: 20px 320px; grid-template-rows: 20px 320px; 
            gap: 10px; margin: 0 auto; justify-content: center;
        }

        .board { display: grid; grid-template-columns: repeat(3, 1fr); width: 320px; height: 320px; position: relative; }
        .board::before, .board::after { content: ''; position: absolute; background: #fff; border-radius: 10px; box-shadow: 0 0 10px #fff; }
        .board::before { width: 5px; height: 100%; left: 33%; box-shadow: 106px 0 0 #fff, 0 0 10px #fff, 106px 0 10px #fff; }
        .board::after { height: 5px; width: 100%; top: 33%; box-shadow: 0 106px 0 #fff, 0 0 10px #fff, 0 106px 10px #fff; }

        .cell { display: flex; align-items: center; justify-content: center; font-size: 6rem; font-weight: 900; width: 106px; height: 106px; cursor: pointer; z-index: 10; }
        .x-lightsaber { color: #fff; text-shadow: 0 0 7px #fff, 0 0 15px #fff, 0 0 25px #00f2ff, 0 0 45px #00f2ff; -webkit-text-stroke: 1px rgba(255,255,255,0.5); }
        .o-lightsaber { color: #fff; text-shadow: 0 0 7px #fff, 0 0 15px #fff, 0 0 25px #bc13fe, 0 0 45px #bc13fe; -webkit-text-stroke: 1px rgba(255,255,255,0.5); }
        .ghost { opacity: 0.15; filter: blur(2px); }

        .btn-main { width: 300px; height: 65px; display: flex; align-items: center; justify-content: center; border-radius: 20px; font-weight: 900; margin-bottom: 20px; transition: 0.2s; border: 2px solid; cursor: pointer; background: transparent; }
        .btn-outline-yellow { border-color: #facc15; color: #facc15; box-shadow: 0 0 10px rgba(250, 204, 21, 0.2); }
        .btn-outline-multi { border-color: #fff; color: #fff; box-shadow: 0 0 15px #bc13fe, inset 0 0 10px #00f2ff; text-shadow: 0 0 5px #fff; }
        
        .back-btn { position: absolute; top: 20px; right: 20px; width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 100; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .axis-label { color: #444; font-weight: 700; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    </style>
</head>
<body>

    <div id="alertModal" class="modal">
        <div class="bg-zinc-900 border-2 border-red-500 p-8 rounded-[30px] text-center w-80">
            <div class="text-red-500 text-6xl mb-4">⚠️</div>
            <p id="alertMsg" class="text-white text-xl font-bold mb-6"></p>
            <button onclick="hideModal('alertModal')" class="w-full py-3 bg-red-500 text-black font-black rounded-xl">הבנתי</button>
        </div>
    </div>

    <div id="lobby" class="modal" style="display: flex;">
        <h1 class="text-[#00f2ff] text-8xl font-black italic mb-2 tracking-tighter" style="text-shadow: 0 0 20px #00f2ff;">SUPER</h1>
        <h1 class="text-[#bc13fe] text-5xl font-black italic mb-14 tracking-tighter" style="text-shadow: 0 0 15px #bc13fe;">TIC TAC TOE</h1>
        <button onclick="showModal('vocabModal')" class="btn-main btn-outline-yellow text-lg">הכנסת מילים</button>
        <button onclick="startGame('pvp')" class="btn-main btn-outline-multi text-xl">2 שחקנים</button>
        <button onclick="startGame('pvc', 'hard')" class="btn-main text-xl" style="border-color: #bc13fe; color: #bc13fe;">שחקן VS מחשב (מאתגר)</button>
        <button onclick="startGame('pvc', 'easy')" class="btn-main text-lg" style="border-color: #00f2ff; color: #00f2ff;">שחקן VS מחשב (קל)</button>
    </div>

    <div id="gameUI" class="hidden flex-col items-center justify-center h-full">
        <div class="back-btn" onclick="location.reload()">←</div>
        <div id="statusHeader" class="mb-4 text-3xl font-black italic">תור: <span id="turnInfo"></span></div>
        <div class="grid-container">
            <div></div>
            <div class="grid grid-cols-3 w-full"><div class="axis-label">1</div><div class="axis-label">2</div><div class="axis-label">3</div></div>
            <div class="flex flex-col h-full justify-around"><div class="axis-label">A</div><div class="axis-label">B</div><div class="axis-label">C</div></div>
            <div id="mainBoard" class="board"></div>
        </div>
        <button id="nextQuestionBtn" onclick="showQuiz()" class="btn-main hidden" style="margin-top: 40px; border-color: #facc15; color: #facc15; background: rgba(250, 204, 21, 0.1);">לחץ לשאלה הבאה</button>
    </div>

    <div id="vocabModal" class="modal">
        <h2 class="text-[#facc15] text-4xl font-black mb-6 italic">הכנסת מילים</h2>
        <div class="bg-zinc-900/50 p-4 rounded-[30px] border-2 border-zinc-700 w-80">
            <textarea id="vIn" placeholder="apple - תפוח" class="w-full h-80 bg-black/80 text-white p-6 rounded-2xl border border-zinc-800 text-right mb-4 outline-none focus:border-[#facc15] text-lg"></textarea>
            <button onclick="saveVocab()" class="w-full h-14 bg-[#facc15] text-black font-extrabold rounded-xl text-xl">אישור</button>
        </div>
    </div>

    <div id="winModal" class="modal">
        <div class="text-center">
            <h2 id="winTitle" class="text-7xl font-black italic mb-6 tracking-tighter"></h2>
            <div id="winnerIcon" class="text-[12rem] mb-14 leading-none"></div>
            <button onclick="location.reload()" class="btn-main btn-outline-yellow text-2xl h-20 mx-auto">משחק חדש</button>
        </div>
    </div>

    <div id="quizModal" class="modal">
        <div id="qText" class="text-7xl font-black mb-16 italic text-center px-6"></div>
        <div id="qOptions" class="flex flex-col gap-4 w-72"></div>
    </div>

    <script>
        let vocab = [], gameMode = 'pvp', difficulty = 'hard', board = Array(9).fill(""), history = {X:[], O:[]}, turn = "X", canMove = false, isGameOver = false;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq, type, duration) {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        const showModal = id => document.getElementById(id).style.display = 'flex';
        const hideModal = id => document.getElementById(id).style.display = 'none';

        function customAlert(msg) {
            document.getElementById('alertMsg').textContent = msg;
            showModal('alertModal');
        }

        function saveVocab() {
            const raw = document.getElementById('vIn').value;
            vocab = raw.split('\n').map(l => {
                const p = l.split(/[–\-\—:]/); 
                return p.length >= 2 ? { en: p[0].trim(), he: p[1].trim() } : null;
            }).filter(x => x);
            if(vocab.length < 3) customAlert("נא להכניס לפחות 3 מילים כדי להתחיל!");
            else hideModal('vocabModal');
        }

        function startGame(mode, diff = 'hard') {
            if(vocab.length < 3) { customAlert("עצור! קודם צריך להכניס מילים."); return; }
            gameMode = mode; difficulty = diff; isGameOver = false;
            hideModal('lobby'); document.getElementById('gameUI').classList.replace('hidden', 'flex');
            initBoard(); startTurn();
        }

        function initBoard() {
            const b = document.getElementById('mainBoard'); b.innerHTML = '';
            for(let i=0; i<9; i++) {
                const c = document.createElement('div'); c.className = 'cell';
                c.onclick = () => { if(canMove && !isGameOver && board[i] === "") makeMove(i); };
                b.appendChild(c);
            }
            render();
        }

        function startTurn() {
            if (isGameOver) return;
            if (gameMode === 'pvc' && turn === 'O') {
                document.getElementById('statusHeader').textContent = "המחשב חושב...";
                document.getElementById('nextQuestionBtn').classList.add('hidden');
                setTimeout(aiAction, 1000);
            } else {
                let colorClass = turn === 'X' ? 'x-lightsaber' : 'o-lightsaber';
                document.getElementById('statusHeader').innerHTML = `תור: <span id="turnInfo" class="${colorClass}">${turn}</span>`;
                document.getElementById('nextQuestionBtn').classList.remove('hidden');
            }
        }

        function showQuiz() {
            document.getElementById('nextQuestionBtn').classList.add('hidden');
            const item = vocab[Math.floor(Math.random() * vocab.length)];
            const opts = [item.he];
            while(opts.length < Math.min(4, vocab.length)) {
                const r = vocab[Math.floor(Math.random()*vocab.length)].he;
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => Math.random() - 0.5);
            
            const qEl = document.getElementById('qText');
            qEl.textContent = item.en;
            qEl.className = `text-7xl font-black mb-16 italic text-center px-6 ${turn === 'X' ? 'text-[#00f2ff]' : 'text-[#bc13fe]'}`;
            
            const container = document.getElementById('qOptions'); container.innerHTML = '';
            opts.forEach(o => {
                const btn = document.createElement('button');
                btn.className = 'w-full py-5 rounded-2xl border-2 border-zinc-800 text-white text-2xl font-black';
                btn.textContent = o;
                btn.onclick = () => {
                    if(o === item.he) {
                        playSound(880, 'sine', 0.2); btn.style.borderColor = '#22c55e';
                        setTimeout(() => { hideModal('quizModal'); canMove = true; }, 600);
                    } else {
                        playSound(150, 'square', 0.3); btn.style.borderColor = '#ef4444';
                        document.getElementById('quizModal').classList.add('shake');
                        setTimeout(() => { hideModal('quizModal'); document.getElementById('quizModal').classList.remove('shake'); switchTurn(); }, 800);
                    }
                };
                container.appendChild(btn);
            });
            showModal('quizModal');
        }

        function makeMove(i) {
            board[i] = turn; history[turn].push(i);
            if(checkWin(board, turn)) { isGameOver = true; render(); triggerWin(); return; }
            if(history[turn].length > 3) board[history[turn].shift()] = "";
            render(); canMove = false; switchTurn();
        }

        function triggerWin() {
            const end = Date.now() + 3000;
            (function frame() {
                confetti({ particleCount: 7, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#00f2ff', '#bc13fe', '#facc15'] });
                confetti({ particleCount: 7, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#00f2ff', '#bc13fe', '#facc15'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
            let colorClass = turn === 'X' ? 'x-lightsaber' : 'o-lightsaber';
            document.getElementById('winTitle').textContent = `${turn} - wins!`;
            document.getElementById('winTitle').className = `text-7xl font-black italic mb-6 ${colorClass}`;
            document.getElementById('winnerIcon').textContent = turn === 'X' ? '✕' : '◯';
            document.getElementById('winnerIcon').className = `text-[12rem] mb-14 ${colorClass}`;
            setTimeout(() => showModal('winModal'), 800);
        }

        function switchTurn() { if(!isGameOver) { turn = turn === "X" ? "O" : "X"; render(); startTurn(); } }

        function render() {
            document.querySelectorAll('.cell').forEach((c, i) => {
                const v = board[i]; c.textContent = v === "X" ? "✕" : (v === "O" ? "◯" : "");
                c.className = "cell " + (v === "X" ? "x-lightsaber" : (v === "O" ? "o-lightsaber" : ""));
                if(!isGameOver && v && history[v].length === 3 && history[v][0] === i) c.classList.add('ghost');
            });
        }

        function checkWin(b, p) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(pats => pats.every(idx => b[idx] === p));
        }

        function aiAction() {
            if (isGameOver) return;
            let m;
            if(difficulty === 'easy') {
                const av = board.map((v,i)=>v===""?i:null).filter(v=>v!==null);
                m = av[Math.floor(Math.random()*av.length)];
            } else {
                let bestS = -Infinity;
                for(let i=0; i<9; i++) {
                    if(board[i] === "") {
                        board[i] = "O"; let s = minimax(board, 0, false); board[i] = "";
                        if(s > bestS) { bestS = s; m = i; }
                    }
                }
            }
            makeMove(m);
        }

        function minimax(b, d, isMax) {
            if(checkWin(b, "O")) return 10; if(checkWin(b, "X")) return -10; if(d > 4) return 0;
            let best = isMax ? -Infinity : Infinity;
            for(let i=0; i<9; i++) {
                if(b[i] === "") {
                    b[i] = isMax ? "O" : "X";
                    let s = minimax(b, d+1, !isMax);
                    b[i] = ""; best = isMax ? Math.max(best, s) : Math.min(best, s);
                }
            }
            return best;
        }
    </script>
</body>
</html>
